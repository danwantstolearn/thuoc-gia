<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tra giá thuốc</title>
<style>
  /* Obsidian Nord — đồng bộ theme nqhaidang.com (quartz obsidian-nord) */
  :root {
    --dark0: #2e3440;
    --dark1: #3b4252;
    --dark2: #434c5e;
    --dark3: #4c566a;
    --light0: #d8dee9;
    --light1: #e5e9f0;
    --light2: #eceff4;
    --frost0: #8fbcbb;
    --frost1: #88c0d0;
    --frost2: #81a1c1;
    --frost3: #5e81ac;
    --red: #bf616a;
    --orange: #d08770;
    --yellow: #ebcb8b;
    --green: #a3be8c;
    --purple: #b48ead;
    --radius-s: 4px;
    --radius-m: 8px;
    --radius-l: 12px;
    --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
             system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  ::selection { background: rgba(191, 97, 106, 0.5); }

  body {
    font-family: var(--font);
    background: var(--dark0);
    color: var(--light2);
    min-height: 100vh;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 40px 16px 60px; }

  header { text-align: center; margin-bottom: 24px; }
  header h1 {
    font-size: 1.618rem;  /* golden ratio, theo theme */
    font-weight: 700;
    letter-spacing: -0.015em;
    color: var(--light2);
  }
  header p { color: var(--light0); margin-top: 8px; font-size: 0.875rem; }

  .searchbox {
    display: flex; gap: 8px; position: relative;
    background: var(--dark1);
    border: 1px solid var(--dark2);
    border-radius: var(--radius-m);
    padding: 6px;
  }
  .searchbox:focus-within { border-color: var(--frost2); }
  .searchbox .input-wrap {
    flex: 1; min-width: 0;
    display: flex; align-items: center; position: relative;
  }
  .searchbox input {
    flex: 1; min-width: 0; border: none; outline: none; background: transparent;
    color: var(--light2); font-size: 1rem; padding: 9px 36px 9px 12px;
    border-radius: var(--radius-s); font-family: var(--font);
  }
  .searchbox input::placeholder { color: rgba(216, 222, 233, 0.55); }
  .searchbox #clear {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: 22px; height: 22px; padding: 0;
    border: none; border-radius: 50%; cursor: pointer;
    background: var(--dark3); color: var(--light0);
    font-size: 0.75rem; line-height: 1;
    display: none; align-items: center; justify-content: center;
  }
  .searchbox.has-text #clear { display: flex; }
  .searchbox #clear:hover { background: var(--red); color: var(--dark0); }
  .searchbox button#btn {
    flex-shrink: 0; white-space: nowrap;
    border: none; background: var(--frost2); color: var(--dark0);
    font-size: 0.9375rem; font-weight: 600; padding: 9px 20px;
    border-radius: var(--radius-s); cursor: pointer; font-family: var(--font);
    transition: background 0.15s;
  }
  .searchbox button#btn:hover { background: var(--frost1); }
  .searchbox button#btn:disabled { opacity: 0.5; cursor: wait; }

  .status { text-align: center; color: var(--light0); margin: 16px 0 12px; font-size: 0.875rem; min-height: 20px; }
  .status.error { color: var(--red); }

  .matrix-wrap {
    background: var(--dark1);
    border: 1px solid var(--dark2);
    border-radius: var(--radius-m);
    overflow-x: auto;
  }
  table.matrix { width: 100%; border-collapse: collapse; min-width: 640px; }

  thead { position: sticky; top: 0; z-index: 2; background: var(--dark1); }
  thead th {
    font-size: 0.75rem; font-weight: 600; color: var(--light0);
    padding: 8px 10px; text-align: center;
    border-bottom: 1px solid var(--dark2);
  }
  thead tr.l1 th { font-size: 0.875rem; color: var(--light2); padding-top: 11px; }
  thead tr.l2 th { color: var(--light0); padding-bottom: 9px; }
  thead th.col-name {
    text-align: left; color: var(--light0);
    font-size: 0.6875rem; text-transform: uppercase; letter-spacing: 0.05em;
    position: sticky; left: 0; z-index: 3; background: var(--dark1);
  }
  thead th.sup-err { color: var(--red); }

  tbody td { padding: 8px 10px; font-size: 0.8125rem; vertical-align: middle; text-align: center; }
  tbody tr { border-bottom: 1px solid var(--dark2); }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--dark3); }

  td.thumb {
    position: sticky; left: 0; z-index: 1; background: var(--dark1);
    padding: 6px 8px; text-align: center;
  }

  td.name {
    text-align: left; min-width: 280px; max-width: 420px; line-height: 1.4; font-weight: 400;
    position: sticky; left: 0; background: var(--dark1); z-index: 1;
  }
  td.name .name-row { display: flex; align-items: center; gap: 14px; }
  td.name .title { flex: 1; min-width: 0; }
  td.name .row-thumb {
    width: 150px; height: 150px; object-fit: contain; flex-shrink: 0;
    border-radius: var(--radius-s); border: 1px solid var(--dark2);
    background: var(--dark0);
  }
  tbody tr:hover td.thumb, tbody tr:hover td.name { background: var(--dark3); }
  td.name a { color: var(--orange); text-decoration: none; }
  td.name a:hover { color: var(--frost2); text-decoration: underline; }
  td.price { font-weight: 600; white-space: nowrap; }
  td.price a, td.x a { color: inherit; text-decoration: none; display: inline-block; }
  td.price a:hover, td.x a:hover { color: var(--frost1); text-decoration: underline; }
  td.kedon { font-style: italic; }
  td.kedon a { color: var(--orange); text-decoration: none; font-style: normal; }
  td.kedon a:hover { color: var(--frost2); text-decoration: underline; }
  td.kedon .meta {
    display: block; font-style: normal; font-size: 0.75rem; font-weight: 600;
    margin-top: 2px; white-space: nowrap;
  }
  td.kedon .meta.qa { color: var(--green); }
  td.kedon .meta.review { color: var(--frost0); }
  td.x { color: var(--light0); opacity: 0.5; font-style: italic; }
  td.na { color: var(--light0); opacity: 0.35; }
  .gstart { border-left: 1px solid var(--dark2); }

  .sup-err-note { padding: 10px 16px; color: var(--red); font-size: 0.8125rem; border-top: 1px solid var(--dark2); }
  .empty { padding: 28px 16px; text-align: center; color: var(--light0); font-size: 0.875rem; }

  footer { text-align: center; color: var(--light0); opacity: 0.75; font-size: 0.75rem; margin-top: 28px; line-height: 1.6; }

  .thumb-tooltip,
  .thumb-tooltip img { display: none; }

  ::-webkit-scrollbar { height: 10px; width: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--dark3); border-radius: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }

  @media (max-width: 700px) {
    .wrap { padding-top: 28px; }
    td, th { padding: 7px 9px; }
    .searchbox button { padding: 9px 14px; }
  }

  /* ============ Mobile: card layout (thay bảng khi màn hình hẹp) ============ */
  .cards { display: flex; flex-direction: column; gap: 12px; }
  .card {
    background: var(--dark1);
    border: 1px solid var(--dark2);
    border-radius: var(--radius-m);
    overflow: hidden;
  }
  .c-head { display: flex; gap: 10px; padding: 10px 12px; align-items: flex-start; }
  .c-thumb {
    width: 64px; height: 64px; object-fit: contain; flex-shrink: 0;
    border-radius: var(--radius-s); border: 1px solid var(--dark2);
    background: var(--dark0);
  }
  .c-title { font-size: 0.8125rem; line-height: 1.45; font-weight: 500; }
  .csup { padding: 8px 12px; border-top: 1px solid var(--dark2); }
  .csup-name { font-size: 0.75rem; font-weight: 700; color: var(--frost1); margin-bottom: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    background: var(--dark2); border-radius: var(--radius-s);
    padding: 3px 8px; font-size: 0.8125rem;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .chip a { color: var(--orange); text-decoration: none; font-weight: 600; }
  .chip a:hover { color: var(--frost1); text-decoration: underline; }
  .csup-x { color: var(--light0); opacity: 0.55; font-style: italic; font-size: 0.8125rem; }
  .kedon a { color: var(--orange); text-decoration: none; }
  .kedon a:hover { color: var(--frost2); text-decoration: underline; }
  .kedon .meta { display: block; font-style: normal; font-size: 0.75rem; font-weight: 600; margin-top: 2px; }
  .kedon .meta.qa { color: var(--green); }
  .kedon .meta.review { color: var(--frost0); }

  /* Mini-bảng: hàng = nhà cung cấp, cột = đơn vị (nhìn dọc thẳng hàng) */
  .c-table { border-top: 1px solid var(--dark2); }
  .ct-row { display: grid; align-items: center; }
  .ct-row + .ct-row { border-top: 1px solid var(--dark2); }
  .ct-head { background: var(--dark2); }
  .ct-name {
    padding: 7px 10px; font-size: 0.75rem; font-weight: 700; color: var(--frost1);
    text-align: left; line-height: 1.3;
  }
  .ct-unit {
    padding: 7px 6px; font-size: 0.6875rem; font-weight: 600; color: var(--light0);
    text-align: center;
  }
  .ct-cell { padding: 7px 6px; font-size: 0.8125rem; font-weight: 600; text-align: center; }
  .ct-cell a { color: var(--orange); text-decoration: none; }
  .ct-cell a:hover { color: var(--frost1); text-decoration: underline; }
  .ct-cell.na { color: var(--light0); opacity: 0.4; }
  .ct-nosup {
    padding: 7px 12px; font-size: 0.75rem; color: var(--light0); opacity: 0.55;
    font-style: italic; border-top: 1px solid var(--dark2);
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Tra giá thuốc</h1>
    <p>So sánh giá giữa các nhà cung cấp, theo từng đơn vị bán</p>
  </header>

  <div class="searchbox" id="searchbox">
    <div class="input-wrap">
      <input id="q" type="text" placeholder="VD: paracetamol, amoxicillin, panadol..." autocomplete="off">
      <button id="clear" type="button" title="Xóa toàn bộ" aria-label="Xóa toàn bộ">✕</button>
    </div>
    <button id="btn">Tra cứu</button>
  </div>
  <div id="status" class="status"></div>

  <div id="results"></div>

  <footer>
    Giá lấy trực tiếp từ trang web nhà cung cấp, có thể thay đổi theo thời điểm.<br>
    "x" = không bán / không có giá công khai (thuốc kê đơn). Dùng cho mục đích tham khảo cá nhân.
  </footer>
</div>

<script>
const $q = document.getElementById('q');
const $btn = document.getElementById('btn');
const $status = document.getElementById('status');
const $results = document.getElementById('results');
const $clear = document.getElementById('clear');
const $searchbox = document.getElementById('searchbox');

function syncClear() {
  $searchbox.classList.toggle('has-text', $q.value.length > 0);
}
$clear.addEventListener('click', () => {
  $q.value = '';
  $status.textContent = '';
  $status.className = 'status';
  $results.innerHTML = '';
  syncClear();
  $q.focus();
});
$q.addEventListener('input', syncClear);

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

const fmt = n => n.toLocaleString('vi-VN') + '₫';

async function search() {
  const q = $q.value.trim();
  if (!q) { $status.textContent = 'Nhập tên thuốc đã!'; return; }

  $btn.disabled = true;
  $status.className = 'status';
  $status.textContent = 'Đang tra cứu từ các nhà cung cấp...';
  $results.innerHTML = '';

  try {
    let data = null;
    // Ưu tiên backend Flask nếu có (chạy local); không có thì gọi thẳng API supplier
    try {
      const r = await fetch('/api/search?q=' + encodeURIComponent(q));
      if (r.ok) data = await r.json();
    } catch (e) { /* không có backend (GitHub Pages) */ }
    if (!data) data = await matrixSearch(q);
    render(q, data);
  } catch (e) {
    $status.className = 'status error';
    $status.textContent = 'Lỗi: ' + e.message;
  } finally {
    $btn.disabled = false;
  }
}

let lastQ = null, lastData = null;
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (lastData) render(lastQ, lastData); }, 250);
});

function render(q, data) {
  lastQ = q; lastData = data;
  if (window.matchMedia('(max-width: 700px)').matches) return renderMobile(q, data);
  const sups = data.suppliers || [];
  const units = data.units || [];
  const rows = data.rows || [];
  const okSups = sups.filter(s => s.ok);
  const errSups = sups.filter(s => !s.ok);

  if (!rows.length) {
    $status.textContent = `Không tìm thấy sản phẩm cho "${q}"`;
    $results.innerHTML = errSups.map(s =>
      `<div class="matrix-wrap"><div class="sup-err-note">${esc(s.name)}: không lấy được dữ liệu — ${esc(s.error || 'lỗi không xác định')}</div></div>`
    ).join('');
    return;
  }

  $status.textContent = `Tìm thấy ${rows.length} sản phẩm cho "${q}" (${okSups.length}/${sups.length} nhà cung cấp)`;

  const thead1 = `<tr class="l1">
    <th class="col-name" rowspan="2">Tên thuốc</th>` +
    sups.map(s => `<th colspan="${units.length}" class="${s.ok ? 'gstart' : 'gstart sup-err'}">${esc(s.name)}${s.ok ? '' : ' (lỗi)'}</th>`).join('') +
    `</tr>`;
  const thead2 = `<tr class="l2">` +
    sups.map(s => units.map((u, ui) => `<th class="${ui === 0 ? 'gstart' : ''}">${esc(u.name)}</th>`).join('')).join('') +
    `</tr>`;

  const tbody = rows.map(r => {
    const thumb = r.image
      ? `<img class="row-thumb" src="${esc(r.image)}" alt="" loading="lazy" onerror="this.style.display='none'">`
      : '';
    const nameRow = `<div class="name-row"><span class="title">${esc(r.title)}</span>${thumb}</div>`;
    const cells = sups.map((s, si) => {
      const cell = r.cells[s.id];
      const url = r.urls && r.urls[s.id];
      if (!s.ok) return units.map(() => `<td class="na">–</td>`).join('');

      const has = cell && Object.keys(cell).length > 0;
      if (!has) {
        // Không có ở nhà cung cấp này -> gộp các ô đơn vị
        return `<td class="x gstart" colspan="${units.length}">Không tìm thấy</td>`;
      }
      const anyPrice = units.some(u => {
        const v = cell[u.key];
        return v && v.price != null;
      });
      if (!anyPrice) {
        // Thuốc kê đơn (không có giá công khai) -> gộp + link
        const supName = (r.names && r.names[s.id]) ? r.names[s.id] : '';
        const inner = url
          ? `<a href="${esc(url)}" target="_blank" rel="noopener" title="${esc(supName)}">Thuốc kê đơn</a>`
          : 'Thuốc kê đơn';
        const qa = (r.qa_prices || {})[s.id];
        const rv = (r.review_prices || {})[s.id];
        const fmtItem = x => {
          const unit = x.unit ? '/' + x.unit : '';
          const d = (x.date || '').slice(0, 10).split('-').reverse().join('/');
          return d ? `${fmt(x.price)}${unit} (${d})` : `${fmt(x.price)}${unit}`;
        };
        let meta = '';
        if (qa && qa.length) meta += `<span class="meta qa">giá từ hỏi đáp: ${qa.slice(0, 3).map(fmtItem).join(' · ')}</span>`;
        if (rv && rv.length) meta += `<span class="meta review">giá từ đánh giá: ${rv.slice(0, 3).map(fmtItem).join(' · ')}</span>`;
        return `<td class="kedon gstart" colspan="${units.length}">${inner}${meta}</td>`;
      }

      return units.map((u, ui) => {
        const v = cell && cell[u.key];
        const g = ui === 0 ? ' gstart' : '';
        const supName = (r.names && r.names[s.id]) ? r.names[s.id] : '';
        const wrap = (inner) => url ? `<a href="${esc(url)}" target="_blank" rel="noopener" title="${esc(supName)}">${inner}</a>` : inner;
        if (!v || v.price == null) return `<td class="x${g}">${wrap('x')}</td>`;
        return `<td class="price${g}">${wrap(fmt(v.price))}</td>`;
      }).join('');
    }).join('');
    return `<tr><td class="name">${nameRow}</td>${cells}</tr>`;
  }).join('');

  const errNote = errSups.map(s =>
    `<div class="sup-err-note">⚠ ${esc(s.name)}: không lấy được dữ liệu — ${esc(s.error || 'lỗi không xác định')}</div>`
  ).join('');

  $results.innerHTML = `
    <div class="matrix-wrap">
      <table class="matrix">
        <thead>${thead1}${thead2}</thead>
        <tbody>${tbody}</tbody>
      </table>
      ${errNote}
    </div>`;
}

$btn.addEventListener('click', search);
$q.addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
$q.focus();

// ============ Mobile: card layout ============
function renderMobile(q, data) {
  const sups = data.suppliers || [];
  const units = data.units || [];
  const rows = data.rows || [];
  const okSups = sups.filter(s => s.ok);
  const errSups = sups.filter(s => !s.ok);

  if (!rows.length) {
    $status.textContent = `Không tìm thấy sản phẩm cho "${q}"`;
    $results.innerHTML = errSups.map(s =>
      `<div class="matrix-wrap"><div class="sup-err-note">${esc(s.name)}: không lấy được dữ liệu — ${esc(s.error || 'lỗi không xác định')}</div></div>`
    ).join('');
    return;
  }

  $status.textContent = `Tìm thấy ${rows.length} sản phẩm cho "${q}" (${okSups.length}/${sups.length} nhà cung cấp)`;

  const fmtItem = x => {
    const unit = x.unit ? '/' + x.unit : '';
    const d = (x.date || '').slice(0, 10).split('-').reverse().join('/');
    return d ? `${fmt(x.price)}${unit} (${d})` : `${fmt(x.price)}${unit}`;
  };

  const cards = rows.map(r => {
    const thumb = r.image
      ? `<img class="c-thumb" src="${esc(r.image)}" alt="" loading="lazy" onerror="this.style.display='none'">`
      : '';

    // Các supplier có cell cho sản phẩm này (làm hàng trong bảng)
    const supRows = okSups.filter(s => {
      const cell = r.cells[s.id];
      return cell && Object.keys(cell).length > 0;
    });
    const supNoCell = okSups.filter(s => !supRows.includes(s));
    // Supplier kê đơn thuần: có cell nhưng không có giá công khai nào
    const rxSups = supRows.filter(s =>
      !Object.values(r.cells[s.id]).some(v => v.price != null)
    );
    // Supplier có ít nhất 1 giá -> làm cột trong mini-bảng
    const priceSups = supRows.filter(s =>
      Object.values(r.cells[s.id]).some(v => v.price != null)
    );
    // Các đơn vị xuất hiện trong số supplier có giá (theo thứ tự ưu tiên toàn bảng)
    const prodUnits = units.filter(u => priceSups.some(s => r.cells[s.id][u.key]));

    const kedonBlock = s => {
      const url = r.urls && r.urls[s.id];
      const supName = (r.names && r.names[s.id]) ? r.names[s.id] : '';
      const inner = url
        ? `<a href="${esc(url)}" target="_blank" rel="noopener" title="${esc(supName)}">Thuốc kê đơn</a>`
        : 'Thuốc kê đơn';
      const qa = (r.qa_prices || {})[s.id];
      const rv = (r.review_prices || {})[s.id];
      let meta = '';
      if (qa && qa.length) meta += `<span class="meta qa">giá từ hỏi đáp: ${qa.slice(0, 3).map(fmtItem).join(' · ')}</span>`;
      if (rv && rv.length) meta += `<span class="meta review">giá từ đánh giá: ${rv.slice(0, 3).map(fmtItem).join(' · ')}</span>`;
      return `<div class="csup"><div class="csup-name">${esc(s.name)}</div><div class="kedon">${inner}${meta}</div></div>`;
    };

    let body = '';
    if (!supRows.length) {
      body = `<div class="csup"><div class="csup-name">${esc(supNoCell[0] ? supNoCell[0].name : '')}</div><div class="csup-x">Không tìm thấy</div></div>`;
    } else if (!priceSups.length) {
      // Tất cả là thuốc kê đơn: giữ block cũ (link + giá từ hỏi đáp/đánh giá)
      body = supRows.map(kedonBlock).join('');
    } else {
      // Mini-bảng: cột = đơn vị, hàng = nhà cung cấp CÓ GIÁ
      const colTpl = `grid-template-columns: minmax(84px, 1.1fr) repeat(${prodUnits.length}, 1fr)`;
      const head = `<div class="ct-row ct-head" style="${colTpl}"><div class="ct-name">Nhà thuốc</div>` +
        prodUnits.map(u => `<div class="ct-unit">${esc(u.name)}</div>`).join('') + `</div>`;
      const rowsHtml = priceSups.map(s => {
        const url = r.urls && r.urls[s.id];
        const supName = (r.names && r.names[s.id]) ? r.names[s.id] : '';
        const cells = prodUnits.map(u => {
          const v = r.cells[s.id][u.key];
          if (!v || v.price == null) return `<div class="ct-cell na">–</div>`;
          const inner = url
            ? `<a href="${esc(url)}" target="_blank" rel="noopener" title="${esc(supName)}">${fmt(v.price)}</a>`
            : fmt(v.price);
          return `<div class="ct-cell">${inner}</div>`;
        }).join('');
        return `<div class="ct-row" style="${colTpl}"><div class="ct-name">${esc(s.name)}</div>${cells}</div>`;
      }).join('');
      body = `<div class="c-table">${head}${rowsHtml}</div>`;
      // Supplier kê đơn (có mặt nhưng không giá) -> block riêng: link + giá từ hỏi đáp/đánh giá
      if (rxSups.length) body += rxSups.map(kedonBlock).join('');
      if (supNoCell.length) {
        body += supNoCell.map(s => `<div class="ct-nosup">${esc(s.name)}: không tìm thấy</div>`).join('');
      }
    }

    return `<div class="card"><div class="c-head">${thumb}<div class="c-title">${esc(r.title)}</div></div>${body}</div>`;
  }).join('');

  const errNote = errSups.map(s =>
    `<div class="sup-err-note">⚠ ${esc(s.name)}: không lấy được dữ liệu — ${esc(s.error || 'lỗi không xác định')}</div>`
  ).join('');

  $results.innerHTML = `<div class="cards">${cards}</div>${errNote}`;
}

// ================= Tra cứu trực tiếp từ trình duyệt (GitHub Pages, không backend) =================
const SUPPLIERS = [
  { id: 'longchau', name: 'Nhà thuốc Long Châu' },
  { id: 'pharmacity', name: 'Pharmacity' },
];
const STOP = new Set(
  'vien thuoc hop vi goi tup lo chai ong tui dieu tri giam dau ha sot dung ngay cho be em phu nu nam tre nho lon moi nang ca va co nhe manh cac con'.split(' ')
);
const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const UNIT_PREF = ['vien', 'vi', 'hop'];

function parsePharmacity(d) {
  const out = [];
  for (const it of ((d.data || {}).items || [])) {
    const name = (it.name || '').trim();
    const slug = it.slug;
    if (!name || !slug) continue;
    const variants = [];
    for (const v of (it.variants || [])) {
      if (v.price == null) continue;
      const unit = (v.unit_name || '').trim();
      const price = Math.round(Number(v.price));
      variants.push({ price, unit, price_text: price.toLocaleString('en-US').replace(/,/g, '.') + ' ₫' + (unit ? '/' + unit : '') });
    }
    if (!variants.length) continue;
    out.push({
      title: name.slice(0, 160), price: variants[0].price, price_text: variants[0].price_text,
      variants, image: (it.thumbnail || {}).image_url || '', sku: it.sku,
      url: 'https://www.pharmacity.vn/' + slug + '.html',
    });
  }
  return out;
}

function parseLongChau(d) {
  const out = [];
  for (const p of (d.products || [])) {
    const name = (p.webName || p.name || '').trim();
    const slug = p.slug;
    if (!name || !slug) continue;
    const prices = (p.prices && p.prices.length) ? p.prices : (p.price ? [p.price] : []);
    const variants = [];
    for (const pr of prices) {
      const unit = (pr.measureUnitName || '').trim();
      const price = pr.price != null ? Math.round(Number(pr.price)) : null;
      variants.push({
        price, unit,
        price_text: price != null
          ? price.toLocaleString('en-US').replace(/,/g, '.') + ' ₫' + (unit ? '/' + unit : '')
          : 'Liên hệ' + (unit ? ' (' + unit + ')' : ''),
      });
    }
    if (!variants.length) continue;
    out.push({
      title: name.slice(0, 160), price: variants[0].price, price_text: variants[0].price_text,
      variants, image: p.image || '', sku: p.sku,
      url: 'https://nhathuoclongchau.com.vn/' + slug,
    });
  }
  return out;
}

async function fetchSupplier(sup, q) {
  try {
    if (sup.id === 'pharmacity') {
      const url = 'https://api-gateway.pharmacity.vn/pmc-ecm-product/api/public/search/index'
        + '?platform=1&index=1&limit=20&total=0&refresh=true&keyword=' + encodeURIComponent(q);
      const r = await fetch(url, { headers: { Accept: 'application/json' } });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return parsePharmacity(await r.json());
    }
    if (sup.id === 'longchau') {
      const r = await fetch(
        'https://api.nhathuoclongchau.com.vn/lccus/search-product-service/api/products/ecom/product/search',
        { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ keyword: q }) }
      );
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return parseLongChau(await r.json());
    }
    throw new Error('Không rõ nhà cung cấp');
  } catch (e) {
    return null;
  }
}

function rerank(items, query) {
  const tokens = norm(query).split(' ').filter(t => t.length >= 2);
  if (!tokens.length) return items;
  const weights = tokens.map(t => STOP.has(t) ? 0.5 : 3.0);
  const rare = tokens.filter((t, i) => weights[i] > 1);
  const score = it => {
    const t = norm(it.title);
    let s = 0;
    tokens.forEach((tok, i) => { if (t.includes(tok)) s += weights[i]; });
    if (rare.length && t.startsWith(rare[0])) s += 1.5;
    return s;
  };
  items.forEach(it => { it._score = score(it); });
  return items.slice().sort((a, b) =>
    (b._score - a._score) || ((a.price ?? 1e12) - (b.price ?? 1e12))
  );
}

function productKey(title) {
  // 4 token đặc trưng (không chứa sui/cam/cum — chúng là phần tên sản phẩm)
  const toks = norm(title).split(' ').filter(t => !STOP.has(t) && t.length >= 2);
  return toks.slice(0, 4).join(' ');
}

async function matrixSearch(q) {
  const results = await Promise.all(SUPPLIERS.map(async s => ({ s, items: await fetchSupplier(s, q) })));

  const rows = {};
  const unitDisp = {};
  const suppliersMeta = [];

  for (const { s, items } of results) {
    if (!items) {
      suppliersMeta.push({ id: s.id, name: s.name, ok: false, error: 'Không lấy được dữ liệu' });
      continue;
    }
    suppliersMeta.push({ id: s.id, name: s.name, ok: true, error: null });
    // Lọc bỏ SP không khớp từ khóa nào (search fuzzy trả kèm rác) — chỉ khi query có token thật
    let ranked = rerank(items, q);
    const qTokens = norm(q).split(' ').filter(t => t.length >= 2);
    if (qTokens.length) ranked = ranked.filter(it => (it._score || 0) > 0);
    ranked = ranked.slice(0, 20);
    for (const it of ranked) {
      const k = productKey(it.title);
      if (!k) continue;
      let row = rows[k];
      if (!row) row = rows[k] = { title: it.title, url: it.url, image: it.image || '', names: {}, urls: {}, skus: {}, cells: {}, best_score: 0, _rep_score: -1, _rep_img: false };
      // Item đại diện: score cao nhất, ưu tiên có ảnh — title/hình/url cùng 1 sản phẩm
      const score = it._score || 0;
      if (score > row._rep_score || (score === row._rep_score && it.image && !row._rep_img)) {
        row.title = it.title;
        row.image = it.image || '';
        row.url = it.url || '';
        row._rep_score = score;
        row._rep_img = !!it.image;
      }
      if (it.url) row.urls[s.id] = it.url;
      if (it.sku) row.skus[s.id] = it.sku;
      row.names[s.id] = it.title;
      row.best_score = Math.max(row.best_score, it._score || 0);
      const cell = {};
      for (const v of it.variants) {
        const u = norm(v.unit) || 'khác';
        unitDisp[u] = v.unit || 'Khác';
        cell[u] = { price: v.price, price_text: v.price_text };
      }
      row.cells[s.id] = cell;
    }
  }

  const present = UNIT_PREF.filter(u => unitDisp[u]);
  const others = Object.keys(unitDisp).filter(u => !UNIT_PREF.includes(u)).sort();
  const units = [...present, ...others].map(u => ({ key: u, name: unitDisp[u] }));

  const rowMin = r => {
    let m = null;
    for (const c of Object.values(r.cells)) {
      for (const v of Object.values(c)) {
        if (v.price != null) m = (m == null) ? v.price : Math.min(m, v.price);
      }
    }
    return m;
  };
  const rowsList = Object.values(rows)
    .sort((a, b) => (b.best_score - a.best_score) || ((rowMin(a) ?? 1e12) - (rowMin(b) ?? 1e12)))
    .slice(0, 10);

  // Quét giá từ đánh giá/hỏi đáp cho thuốc kê đơn (giới hạn 4 sản phẩm)
  const rxRows = [];
  for (const row of rowsList) {
    let isRx = false;
    for (const s of SUPPLIERS) {
      const cell = row.cells[s.id];
      if (cell && Object.keys(cell).length && !Object.values(cell).some(v => v.price != null)) {
        if (row.skus && row.skus[s.id]) isRx = true;
      }
    }
    if (isRx) rxRows.push(row);
    if (rxRows.length >= 4) break;
  }
  await Promise.all(rxRows.map(row => scanRowReviews(row)));

  return { query: q, limit: 10, units, suppliers: suppliersMeta, rows: rowsList };
}

// ================= Quét giá trong đánh giá / hỏi đáp (chạy trong browser) =================
const REVIEW_AMOUNT_RE = /(?:giá|mua|hết|trả|bán|khoảng|tốn|với giá)\s*([\d][\d.,]{1,})|([\d][\d.,]{2,})\s*(?:đ|₫|vnđ|vnd|k\b|nghìn|ngàn)/gi;

function stripHtml(t) {
  const d = document.createElement('div');
  d.innerHTML = t;
  return d.textContent || '';
}

function scanAmounts(items) {
  const pairs = [];
  for (const item of items) {
    const plain = stripHtml(item.content || '');
    const date = item.date || '';
    let m;
    REVIEW_AMOUNT_RE.lastIndex = 0;
    while ((m = REVIEW_AMOUNT_RE.exec(plain))) {
      const raw = (m[1] || m[2] || '').trim();
      const n = parseInt(raw.replace(/[.,\s]/g, ''), 10);
      if (isNaN(n)) continue;
      if (n >= 1900 && n <= 2100) continue;
      if (n < 500 || n > 50000000) continue;
      if ((n >= 18000000 && n <= 18999999) || (n >= 19000000 && n <= 19999999)) continue;
      const tail = plain.slice(m.index + m[0].length, m.index + m[0].length + 30);
      const um = /\/\s*([a-zA-ZÀ-ỹ]{2,12})/.exec(tail);
      let unit = '';
      if (um) {
        const u = norm(um[1]);
        if (['vien','vi','hop','goi','tuyp','chai','lo','ong','tui','hu','kit'].includes(u)) {
          unit = { vien:'Viên', vi:'Vỉ', hop:'Hộp', goi:'Gói', tuyp:'Tuýp', chai:'Chai', lo:'Lọ', ong:'Ống', tui:'Túi', hu:'Hũ', kit:'Kit' }[u];
        }
      }
      pairs.push({ price: n, date, unit });
    }
  }
  return pairs;
}

function recentAmounts(items) {
  const pairs = scanAmounts(items).sort((a, b) => (b.date < a.date ? -1 : b.date > a.date ? 1 : 0));
  const seen = new Set(), out = [];
  for (const p of pairs) {
    const key = p.price + '|' + p.unit;
    if (seen.has(key)) continue;
    seen.add(key);
    out.push(p);
    if (out.length >= 3) break;
  }
  return out;
}

async function fetchLcTexts(kind, sku) {
  const path = kind === 'qa'
    ? 'v3/comments?maxResultCount=20&maxReplies=5&skipCount=0&sortBy=createdAt,DESC&filterType=PRODUCT'
    : 'v3/comments/ratings?maxResultCount=20&maxReplies=5&skipCount=0&filterType=PRODUCT';
  const r = await fetch(`https://api.nhathuoclongchau.com.vn/lccus/ecom-prod/store-front/${path}&targetId=${sku}`);
  if (!r.ok) return [];
  const d = await r.json();
  const out = [];
  for (const it of (d.items || [])) {
    const c = (it.content || '').trim();
    if (c) out.push({ content: c, date: it.createdAt || '' });
    for (const rp of (it.replies || [])) {
      const rc = (rp.content || '').trim();
      if (rc) out.push({ content: rc, date: rp.createdAt || '' });
    }
  }
  return out;
}

async function fetchPcTexts(kind, sku) {
  const url = kind === 'qa'
    ? `https://api-gateway.pharmacity.vn/pmc-ecm-review/api/public/comment?limit=20&refresh=true&total=0&data_id=${sku}&order_by=category&order=desc&index=1`
    : `https://api-gateway.pharmacity.vn/pmc-ecm-review/api/public/product-review?sku=${sku}&index=1&limit=20`;
  const r = await fetch(url);
  if (!r.ok) return [];
  const d = await r.json();
  const items = (d.data && d.data.items) || d.items || [];
  const out = [];
  for (const it of items) {
    const c = (it.content || it.comment || it.review || '').trim();
    if (c) out.push({ content: c, date: it.created_at || it.createdAt || '' });
  }
  return out;
}

async function scanRowReviews(row) {
  for (const s of SUPPLIERS) {
    const cell = row.cells[s.id];
    if (!cell || !row.skus || !row.skus[s.id]) continue;
    if (Object.keys(cell).length && !Object.values(cell).some(v => v.price != null)) {
      const sku = row.skus[s.id];
      try {
        const [rvItems, qaItems] = s.id === 'longchau'
          ? [await fetchLcTexts('review', sku), await fetchLcTexts('qa', sku)]
          : [await fetchPcTexts('review', sku), await fetchPcTexts('qa', sku)];
        const rv = recentAmounts(rvItems);
        const qa = recentAmounts(qaItems);
        if (rv.length) (row.review_prices = row.review_prices || {})[s.id] = rv;
        if (qa.length) (row.qa_prices = row.qa_prices || {})[s.id] = qa;
      } catch (e) { /* bỏ qua nếu lỗi mạng */ }
    }
  }
}
